[build-system]
requires = ["setuptools>=80,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "agrosphere-ai-service"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi==0.161.1", "pydantic==2.14.1", "uvicorn==0.54.0", "sqlalchemy==2.1.6", "psycopg[binary]==3.3.6", "alembic==1.20.1", "PyJWT[crypto]==2.15.1", "cryptography==50.0.2", "pika==1.4.4", "jsonschema==4.26.0", "httpx==0.28.1", "tzdata==2026.5"]

[project.optional-dependencies]
test = ["pytest==9.1.1", "httpx==0.28.1"]
ml = ["scikit-learn==1.9.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
agrosphere_ai = ["contracts/*.json", "sql/*.sql"]
